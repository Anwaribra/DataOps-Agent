version: 2

models:
  - name: fct_orders
    description: "Fact table containing order transactions and payment status"
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id

  - name: dim_customers
    description: "Dimension table containing customer details and order history summary"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: dim_products
    description: "Dimension table containing product inventory details"
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
